<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="cover-title cover-description">
  <title id="cover-title">Companion Auto Summon for No Man's Sky — by Lineum Dynamics</title>
  <desc id="cover-description">A dark navy and teal project cover, with the original white paw and clockwise arrow glyph beside the title. Abstract orbital lines decorate the background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071421"/>
      <stop offset="1" stop-color="#0b2630"/>
    </linearGradient>
    <radialGradient id="teal-light">
      <stop offset="0" stop-color="#2b9f9c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2b9f9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61c8bd" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#61c8bd" stop-opacity="0"/>
    </linearGradient>
    <symbol id="companion-glyph" viewBox="0 0 256 256">
      <g fill="#fff">
        <path d="M215 147 A89 89 0 1 1 203 80" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round"/>
        <path d="M198 59 Q196 57 196 62 L190 95 Q190 98 193 99 L224 106 Q229 107 227 102 L202 61 Q200 58 198 59Z"/>
        <ellipse cx="83" cy="125" rx="13" ry="20" transform="rotate(-28 83 125)"/>
        <ellipse cx="110" cy="97" rx="14" ry="22" transform="rotate(-12 110 97)"/>
        <ellipse cx="147" cy="97" rx="14" ry="22" transform="rotate(12 147 97)"/>
        <ellipse cx="174" cy="125" rx="13" ry="20" transform="rotate(28 174 125)"/>
        <path d="M128 132 C117 132 111 143 103 152 C94 162 89 168 92 178 C95 189 108 187 119 184 C125 182 131 182 137 184 C148 187 161 189 164 178 C167 168 162 162 153 152 C145 143 139 132 128 132Z"/>
      </g>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <ellipse cx="1274" cy="411" rx="628" ry="598" fill="url(#teal-light)"/>

  <g fill="none" stroke="#73b9b5">
    <circle cx="1230" cy="418" r="262" stroke-opacity="0.20"/>
    <circle cx="1230" cy="418" r="327" stroke-opacity="0.09"/>
    <circle cx="1230" cy="418" r="425" stroke-opacity="0.055"/>
    <path d="M1089 197 A262 262 0 0 1 1466 531" stroke-width="2" stroke-opacity="0.44"/>
  </g>
  <circle cx="1089" cy="197" r="4" fill="#87dbce"/>
  <circle cx="1473" cy="734" r="2.5" fill="#87dbce" fill-opacity="0.38"/>
  <circle cx="925" cy="159" r="2" fill="#87dbce" fill-opacity="0.30"/>

  <rect x="116" y="216" width="56" height="4" rx="2" fill="#7addcb"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="112" y="333" fill="#f3f7f8" font-size="86" font-weight="400" letter-spacing="-2">Companion</text>
    <text x="108" y="455" fill="#f3f7f8" font-size="112" font-weight="650" letter-spacing="-3">Auto Summon</text>
    <text x="116" y="523" fill="#97c2c8" font-size="34" font-weight="400" letter-spacing="0.5">for No Man's Sky</text>
    <text x="116" y="756" fill="#9bb5bf" font-size="24" font-weight="400">by <tspan fill="#d4e4e8" font-weight="600">Lineum Dynamics</tspan></text>
  </g>

  <use href="#companion-glyph" x="1042" y="230" width="376" height="376"/>
  <rect x="116" y="789" width="720" height="1" fill="url(#rule)"/>
</svg>
